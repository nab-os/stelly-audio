[package]
name = "stelly-audio"
version = "0.1.0"
edition = "2021"
description = "Audio analysis without network or database: decoding, resampling, descriptors (tempo, key, loudness, timbre) and CLAP's audio tower"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nab-os/stelly-audio"
keywords = ["audio", "music", "analysis", "clap", "mir"]
categories = ["multimedia::audio"]

[features]
default = ["clap"]
# CLAP's audio tower through ONNX Runtime. The mel front end alone needs none.
clap = ["dep:ort"]
# Every codec and container symphonia has, for local files. MP3 alone is what
# Stelly's excerpts need.
all-codecs = ["symphonia/all-codecs", "symphonia/all-formats"]

[dependencies]
anyhow = "1"
ebur128 = "0.1.10"
# Exact: a pre-release requirement takes any later pre-release, and rc.14
# changed `Session::builder`.
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"], optional = true }
realfft = "3.5.0"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }

[dev-dependencies]
bytemuck = "1"

# The resampling, mel spectrogram and descriptors are tight loops that run
# ~7x slower unoptimised.
[profile.dev]
opt-level = 3
